[package]
name = "scaleset"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Autoscale GitHub Actions self-hosted runners: a client for the Runner Scale Set APIs."
license = "MIT"
repository = "https://github.com/imumesh18/scaleset"
documentation = "https://docs.rs/scaleset"
readme = "README.md"
keywords = ["github", "actions", "runners", "autoscaling", "ci"]
categories = ["api-bindings", "asynchronous", "development-tools"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "docs/DESIGN.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[features]
default = ["rustls"]
# TLS through rustls (with aws-lc-rs).
rustls = ["reqwest/rustls"]
# TLS through the platform's native library.
native-tls = ["reqwest/native-tls"]
# `scaleset::testing`, a stateful emulator of the scale set APIs, and the
# `scaleset-emulator` binary.
testing = ["dep:axum", "tokio/net", "tokio/rt", "tokio/signal"]

[dependencies]
aws-lc-rs = { version = "1.13", default-features = false, features = ["aws-lc-sys", "alloc"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
fastrand = "2"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "charset", "system-proxy"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.38", features = ["macros", "sync", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
anyhow = "1"
# The crate's own tests use the emulator.
scaleset = { path = ".", features = ["testing"] }
tokio = { version = "1.38", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

[[bin]]
name = "scaleset-emulator"
required-features = ["testing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
